<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次條碼產生器</title>
    <!-- 引入 JsBarcode 套件 -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            padding: 30px 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            margin-top: 0;
            color: #1e3a8a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        p.subtitle {
            font-size: 0.9em;
            color: #64748b;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: monospace;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .barcode-list {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .barcode-card {
            background: #fafafa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .barcode-info {
            font-size: 0.85em;
            color: #475569;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .error-card {
            background: #fff1f2;
            border-color: #fecdd3;
            color: #e11d48;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>多行輸入條碼產生器</h2>
    <p class="subtitle">請在下方逐行輸入數字：8 碼 (EAN-8)、12 碼 (UPC-A)、13 碼 (EAN-13)</p>
    
    <textarea id="barcodeInput" placeholder="請輸入資料，每行一筆，例如：&#10;12345670&#10;012345678905&#10;4711234567899"></textarea>

    <div id="barcodeOutput" class="barcode-list"></div>
</div>

<script>
    const inputElement = document.getElementById('barcodeInput');
    const outputElement = document.getElementById('barcodeOutput');

    function generateBarcodes() {
        outputElement.innerHTML = ''; // 清除舊有的內容
        const lines = inputElement.value.split('\n');

        lines.forEach((line, index) => {
            const trimmed = line.trim();
            if (!trimmed) return; // 跳過空行

            const len = trimmed.length;
            let format = '';

            // 判斷對應規格
            if (len === 8) {
                format = 'EAN8';
            } else if (len === 12) {
                format = 'UPC';
            } else if (len === 13) {
                format = 'EAN13';
            }

            if (format) {
                // 建立顯示卡片與 SVG 元素
                const card = document.createElement('div');
                card.className = 'barcode-card';
                
                const info = document.createElement('div');
                info.className = 'barcode-info';
                info.textContent = `第 ${index + 1} 行：[${format}] ${trimmed}`;
                
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.id = `barcode-${index}`;

                card.appendChild(info);
                card.appendChild(svg);
                outputElement.appendChild(card);

                // 使用 JsBarcode 渲染條碼
                try {
                    JsBarcode(`#barcode-${index}`, trimmed, {
                        format: format,
                        width: 2,
                        height: 60,
                        displayValue: true
                    });
                } catch (err) {
                    info.textContent = `第 ${index + 1} 行：[${format}] 渲染失敗（請確認檢查碼 Checksum 是否正確）`;
                    info.style.color = '#e11d48';
                    svg.remove();
                }
            } else {
                // 規格不符提示
                const errorCard = document.createElement('div');
                errorCard.className = 'error-card';
                errorCard.textContent = `第 ${index + 1} 行：「${trimmed}」不符合規格 (字元長度：${len} 碼，僅接受 8、12、13 碼數字)`;
                outputElement.appendChild(errorCard);
            }
        });
    }

    // 監聽輸入事件，實現即時產生效果
    inputElement.addEventListener('input', generateBarcodes);
</script>

</body>
</html>
