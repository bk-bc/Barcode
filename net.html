<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天羅矩陣 2.0 ・ 智慧數據收集器</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --primary-color: #2b579a;
            --border-color: #dcdfe6;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 5px;
        }
        .magic-zone {
            background: #eef4fa;
            border: 1px dashed #2b579a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .magic-zone p { margin: 0; font-size: 14px; color: #2b579a; font-weight: bold; }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .input-box input, .input-box select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }
        .btn-group {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-magic { background-color: #2b579a; color: white; padding: 12px 25px; box-shadow: 0 2px 6px rgba(43,87,154,0.3); }
        .btn-magic:hover { background-color: #1e3f72; }
        .btn-add { background-color: #4caf50; color: white; }
        .btn-export { background-color: #ff9800; color: white; }
        .btn-clear { background-color: #f44336; color: white; }
        
        .table-container {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f5f7fa;
            color: #909399;
            font-weight: bold;
        }
        tr:hover { background-color: #f9fafc; }
    </style>
</head>
<body>

<div class="container">
    <h2>天羅矩陣 2.0 ・ 智慧數據收集器</h2>
    
    <!-- 智慧一鍵貼上區 -->
    <div class="magic-zone">
        <p>💡 快捷工作流：在 AI 對話框複製整篇「天羅模式」輸出，點擊右側按鈕即可秒級自動填表！</p>
        <button class="btn-magic" onclick="pasteAndParse()">📋 一鍵解析剪貼簿文字</button>
    </div>
    
    <!-- 表單輸入 -->
    <div class="form-group" id="matrixForm">
        <div class="input-box"><label>姓名</label><input type="text" id="name" placeholder="自動解析填入"></div>
        <div class="input-box"><label>改名備註</label><input type="text" id="alias" placeholder="自動解析填入"></div>
        <div class="input-box"><label>生日</label><input type="text" id="birthday" placeholder="自動解析填入"></div>
        <div class="input-box"><label>日主格神</label><input type="text" id="bazi" placeholder="自動解析填入"></div>
        <div class="input-box">
            <label>關係類別</label>
            <select id="relation">
                <option value="A:核心血親">A:核心血親</option>
                <option value="B:摯友摯交">B:摯友摯交</option>
                <option value="C:職場校友" selected>C:職場校友</option>
                <option value="D:一般社群">D:一般社群</option>
            </select>
        </div>
        <div class="input-box"><label>當前職業</label><input type="text" id="job" placeholder="自動解析填入"></div>
        <div class="input-box"><label>當前職業適合度</label><input type="text" id="jobFit" placeholder="自動解析填入"></div>
        <div class="input-box"><label>隱藏天賦職業</label><input type="text" id="talent" placeholder="自動解析填入"></div>
        <div class="input-box"><label>能量互補指數 (1-5)</label><input type="number" id="complement" min="1" max="5" value="3"></div>
        <div class="input-box"><label>人際網絡圈標籤</label><input type="text" id="network" placeholder="自動解析填入"></div>
        
        <div class="btn-group">
            <button class="btn-add" onclick="addData()">新增至矩陣</button>
            <button class="btn-export" onclick="exportCSV()">導出 CSV 檔</button>
            <button class="btn-clear" onclick="clearData()">清空快取</button>
        </div>
    </div>

    <!-- 數據預覽表格 -->
    <div class="table-container">
        <h3>當前本地庫存清單 (<span id="dataCount">0</span> 筆)</h3>
        <table>
            <thead>
                <tr>
                    <th>姓名</th><th>改名備註</th><th>生日</th><th>日主格神</th><th>關係類別</th>
                    <th>當前職業</th><th>當前職業適合度</th><th>隱藏天賦職業</th><th>互補指數</th><th>網絡標籤</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let matrixData = JSON.parse(localStorage.getItem('天羅矩陣數據')) || [];

    function renderTable() {
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';
        document.getElementById('dataCount').innerText = matrixData.length;
        matrixData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.name}</td><td>${item.alias}</td><td>${item.birthday}</td><td>${item.bazi}</td><td>${item.relation}</td>
                <td>${item.job}</td><td>${item.jobFit}</td><td>${item.talent}</td><td>${item.complement}</td><td>${item.network}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 核心魔法：解析剪貼簿 Markdown 的正則表達式邏輯
    async function pasteAndParse() {
        try {
            const text = await navigator.clipboard.readText();
            if(!text) { alert('剪貼簿裡好像沒有文字喔！'); return; }

            // 定義對應關係的映射表
            const regexMap = {
                name: /針\*\*姓名\*\*：\s*(.*?)\s*\n|\*\s*\*\*姓名\*\*：\s*(.*?)\s*\n/i,
                alias: /\*\s*\*\*改名備註\*\*：\s*(.*?)\s*\n/i,
                birthday: /\*\s*\*\*生日\*\*：\s*(.*?)\s*\n/i,
                bazi: /\*\s*\*\*日主格神\*\*：\s*(.*?)\s*\n/i,
                job: /\*\s*\*\*當前職業\*\*：\s*(.*?)\s*\n/i,
                jobFit: /\*\s*\*\*當前職業適合度\*\*：\s*(.*?)\s*\n/i,
                talent: /\*\s*\*\*隱藏天賦職業\*\*：\s*(.*?)\s*\n/i,
                complement: /\*\s*\*\*能量互補指數\*\*：\s*(\d+)/i,
                network: /\*\s*\*\*人際網絡圈標籤\*\*：\s*(.*?)\s*\n/i,
                relation: /\*\s*\*\*關係類別\*\*：\s*(.*?)\s*\n/i
            };

            // 跑循環進行正則比對填入
            Object.keys(regexMap).forEach(key => {
                const match = text.match(regexMap[key]);
                if (match) {
                    // 抓取非空的分組捕獲結果
                    const val = (match[1] || match[2] || '').trim();
                    if(key === 'relation') {
                        // 下拉選單模糊匹配
                        const select = document.getElementById('relation');
                        for(let i=0; i<select.options.length; i++) {
                            if(select.options[i].value.includes(val.split(':')[0])) {
                                select.selectedIndex = i;
                                break;
                            }
                        }
                    } else if(key === 'complement') {
                        document.getElementById('complement').value = parseInt(val) || 3;
                    } else {
                        document.getElementById(key).value = val;
                    }
                }
            });
            
            // 提示成功，但讓使用者確認後再手動點點擊「新增至矩陣」，防範出錯
            alert('🎉 解析成功！資料已帶入輸入框，請確認無誤後點擊「新增至矩陣」。');

        } catch (err) {
            alert('無法讀取剪貼簿，請確保已給予網頁剪貼簿存取權限，或換用 Chrome/Edge 瀏覽器。');
            console.error(err);
        }
    }

    function addData() {
        const fields = ['name', 'alias', 'birthday', 'bazi', 'relation', 'job', 'jobFit', 'talent', 'complement', 'network'];
        const item = {};
        if(!document.getElementById('name').value.trim()) { alert('請至少輸入姓名！'); return; }
        
        fields.forEach(f => { item[f] = document.getElementById(f).value.trim(); });
        matrixData.push(item);
        localStorage.setItem('天羅矩陣數據', JSON.stringify(matrixData));
        renderTable();
        
        fields.forEach(f => {
            if(f !== 'relation' && f !== 'complement') document.getElementById(f).value = '';
        });
    }

    function exportCSV() {
        if (matrixData.length === 0) { alert('目前沒有數據可供導出！'); return; }
        const headers = ['姓名', '改名備註', '生日', '日主格神', '關係類別', '當前職業', '當前職業適合度', '隱藏天賦職業', '能量互補指數', '人際網絡圈標籤'];
        let csvContent = "\uFEFF" + headers.map(h => `"${h}"`).join(",") + "\r\n";
        matrixData.forEach(item => {
            const row = [item.name, item.alias, item.birthday, item.bazi, item.relation, item.job, item.jobFit, item.talent, item.complement, item.network].map(val => `"${String(val).replace(/"/g, '""')}"`);
            csvContent += row.join(",") + "\r\n";
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", `天羅矩陣基礎事實_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function clearData() {
        if(confirm('確定要清空本地所有快取數據嗎？')) { matrixData = []; localStorage.removeItem('天羅矩陣數據'); renderTable(); }
    }
    renderTable();
</script>
</body>
</html>
